# Bomb Lab contestant restrictions.
#   sudo cp server/etc/sshd_config.d/bomblab.conf /etc/ssh/sshd_config.d/
#   sudo systemctl reload ssh
#
# Requires an "Include /etc/ssh/sshd_config.d/*.conf" line in the main
# sshd_config (default on Ubuntu 22.04/24.04).
#
# NOTE: cloud images (AWS/GCP) ship "PasswordAuthentication no" globally so the
# admin logs in with a key. Contestants use passwords, so we re-enable password
# auth ONLY for the contestants group below - the admin account stays key-only.

Match Group contestants
    PasswordAuthentication yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitTunnel no
    X11Forwarding no
    AllowAgentForwarding no
    MaxSessions 4
    PermitUserRC no
