# Bomb Lab scoreboard - nginx site.
#   sudo cp server/nginx/bomblab.conf /etc/nginx/sites-available/bomblab
#   sudo ln -s /etc/nginx/sites-available/bomblab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, run certbot after this is in place:
#   sudo certbot --nginx -d bomb.example.com

server {
    listen 80;
    server_name bomb.doublejeong.com;

    # Public scoreboard and its APIs.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # /admin is also protected in the app (Basic auth), but block it at the
    # edge too so the operator console is not casually reachable. Remove this
    # block if you want to rely solely on the in-app auth.
    location /admin {
        # Optional extra gate: uncomment to require an nginx-level password.
        # auth_basic "bomblab admin";
        # auth_basic_user_file /etc/bomblab/admin.htpasswd;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
