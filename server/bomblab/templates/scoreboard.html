<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bomb Lab 리더보드</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; background:#0f1220; color:#e8e8f0; }
  header { padding: 16px 20px; background:#171a2e; border-bottom:1px solid #2a2f4a; }
  h1 { margin:0; font-size:20px; }
  .banner { margin-top:8px; padding:6px 10px; border-radius:6px; font-size:13px; display:inline-block; }
  .frozen { background:#3a2d0a; color:#ffd479; }
  .running { background:#0c331f; color:#7ee2a8; }
  .before, .ended { background:#33121a; color:#ff9db0; }
  table { border-collapse: collapse; width:100%; }
  th, td { padding:8px 10px; text-align:center; border-bottom:1px solid #23273f; font-variant-numeric: tabular-nums; }
  th { position:sticky; top:0; background:#171a2e; font-size:12px; letter-spacing:.04em; }
  td.name { text-align:left; font-weight:600; }
  .rank { color:#8a90b8; width:44px; }
  .cell { width:34px; }
  .ok { color:#7ee2a8; font-weight:700; }
  .no { color:#3b3f5c; }
  .sec.ok { color:#ffd479; }
  .score { font-weight:700; font-size:15px; }
  .boom { color:#ff9db0; }
  #updated { color:#6b7099; font-size:12px; padding:10px 20px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Bomb Lab</h1>
  <div id="banner"></div>
</header>
<table>
  <thead>
    <tr>
      <th class="rank">#</th><th style="text-align:left">참가자</th>
      <th class="cell">1</th><th class="cell">2</th><th class="cell">3</th>
      <th class="cell">4</th><th class="cell">5</th><th class="cell">6</th>
      <th class="cell">★</th><th>💥</th><th>점수</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div id="updated"></div>
<script>
function cell(t, secret) {
  if (t) return '<td class="cell ' + (secret ? 'sec ok' : 'ok') + '" title="' + t + '">●</td>';
  return '<td class="cell no">·</td>';
}
async function refresh() {
  try {
    const r = await fetch('/api/scoreboard');
    const d = await r.json();
    document.getElementById('title').textContent = d.contest;
    const b = document.getElementById('banner');
    const labels = {running:'진행 중', frozen:'❄ 리더보드 고정됨 (종료 시 최종 공개)', before:'시작 전', ended:'종료'};
    b.className = 'banner ' + d.state;
    b.textContent = labels[d.state] || d.state;
    const tb = document.getElementById('rows');
    tb.innerHTML = d.rows.map(function(r){
      let c = '';
      for (let p=1;p<=6;p++) c += cell(r.phases[p], false);
      c += cell(r.phases['7'], true);
      return '<tr><td class="rank">'+r.rank+'</td>'
        + '<td class="name">'+r.nickname+'</td>'
        + c
        + '<td class="boom">'+(r.explosions||'')+'</td>'
        + '<td class="score">'+r.score+'</td></tr>';
    }).join('');
    document.getElementById('updated').textContent = '갱신: ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('updated').textContent = '서버 연결 실패, 재시도 중...';
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
